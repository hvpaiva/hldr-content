kind: PageKind
metadata:
  name: project
spec:
  names:
    kind: Project
    singular: project
    plural: projects
    short_names: [proj, p]
  fields:
    tagline:
      type: string
      required: true
      description: One line shown under the title in lists and on the home page.
    status:
      type: enum
      values: [active, wip, archived]
      ok: [active]
      required: true
      description: >-
        Where a project stands: active is maintained and in use, wip is under
        construction, archived is kept for reference.
    highlight:
      type: int
      description: >-
        Position among the highlights on the home page. Lower numbers come
        first; without one, the project is not highlighted.
    tags:
      type: list
      description: Free-form labels shown next to the project.
    links:
      type: links
      keys: [repo, docs, demo]
      description: The source repository, the documentation and a live demo.
    github:
      type: string
      description: GitHub repository as owner/name, the key for repository metrics.
  summary: tagline
  footer: |

    {{ clone page.links.repo }}
    {{ link /projects "← projects/" }}
  json_ld:
    type: SoftwareSourceCode
    map:
      description: tagline
      codeRepository: links.repo
      programmingLanguage: tags
